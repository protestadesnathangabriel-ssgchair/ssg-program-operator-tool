  }
  function applyControlPreviewMirror(payload){
    if(!payload)return;
    controlPreviewState.scrollTop=Number(payload.scrollTop||0);
    controlPreviewState.zoom=Number(payload.zoom||100);
    controlPreviewState.scrolling=!!payload.scrolling;
    controlPreviewState.speed=Number(payload.speed||3);
    if(payload.activeItemId!==undefined)controlPreviewState.activeItemId=payload.activeItemId||'';
    const root=getControlPreviewContent();
    if(root){
      if(typeof payload.html==='string' && payload.html) root.innerHTML=payload.html;
      root.style.zoom=controlPreviewState.zoom/100;
      root.scrollTop=controlPreviewState.scrollTop;
      root.querySelectorAll('.display-item').forEach(el=>el.classList.toggle('active',el.dataset.itemId===controlPreviewState.activeItemId));
    }
    // The Control window already has its dedicated timer above the control panel.
    // Do not render a second timer beside the preview. The actual Display timer
    // remains completely unchanged.
  }
  function initControl(){
    const token=getStoredAuth()?.token||'';
    if(!token){ document.body.innerHTML='<div class="auth-gate"><div class="auth-card"><div class="auth-brand">SSG PROGRAM GUIDE BUILDER<small>CONTROL LOCKED</small></div><p class="auth-sub">This control window requires an active signed-in session.</p></div></div>'; return; }
    openPresenterChannel();
    document.body.innerHTML=`<div class="control-shell"><div class="control-body"><div class="control-left"><div class="control-timer-pane"><div id="controlPreviewTimer" class="display-timer"><div id="controlPreviewTimerSmall" class="display-timer-small">TIMER</div><div id="controlPreviewTimerName" class="display-timer-name">No active timer</div><div id="controlPreviewTimerClock" class="display-timer-clock">00:00:00</div><div id="controlPreviewOvertime" class="display-overtime">OVERTIME</div></div></div><div class="control-control-pane"><div class="control-top"><div><h2>SSG PROGRAM GUIDE BUILDER — CONTROL / TIMER</h2><div id="controlTarget" class="control-target">0 → DISPLAY</div></div><div><button class="btn small" onclick="window.close()">Close</button></div></div><div id="controlList" class="control-list"><div class="card"><div style="font-size:12px;color:#68737e">Loading program...</div></div></div><div class="control-hint">Keyboard shortcuts in this Control window also control the Display: Space = play/pause, 1–5 = speed, [ = zoom out, ] = zoom in, 0 = switch target.</div></div></div><aside class="control-preview-pane"><div id="controlPreviewScreen" class="control-preview-screen"><div style="color:#aaa;font-size:14px;padding:30px">Loading program...</div></div></aside></div></div>`;
    window.addEventListener('message',e=>{const d=e.data||{};if(!d||d.ssgPresenter!==true)return;if(d.type==='guide'&&d.guide){controlState.guide=d.guide;prepareTimers();renderControl();renderControlPreview();}if(d.type==='targetState'){controlState.target=d.target;renderControlTarget();}if(d.type==='displayMirrorState'){applyControlPreviewMirror(d.payload||{});}if(d.type==='timerState'){controlPreviewState.timer=d.payload||null;renderControlPreviewTimer();}if(d.type==='activeItem'){controlPreviewState.activeItemId=d.payload?.itemId||'';setControlPreviewActiveItem(controlPreviewState.activeItemId);}});
    // Load the selected saved guide directly in the control window as well.
    if(APP_CONFIG.guideId){
      google.script.run.withSuccessHandler(function(guide){
        if(guide&&guide.id){controlState.guide=guide;prepareTimers();renderControl();renderControlPreview();}
      }).withFailureHandler(function(err){console.warn('Control guide load failed:',err);}).apiCall('getGuide',[APP_CONFIG.guideId],token);
    }
    window.addEventListener('keydown',e=>{
      if(e.repeat)return;
      const key=(e.code==='Numpad0'||e.key==='0')?'0':(e.code==='Space'||e.key===' ')?' ':e.key;
      // 0 is the ONLY key that changes the active keyboard window.
      if(key==='0'){
        e.preventDefault();
        e.stopPropagation();
        requestPresenterTargetToggle(controlState.target,'control');
        return;
      }
      // Control window can operate the Display directly with the same
      // keyboard shortcuts used by the Display window.
      if(key===' '||key==='['||key===']'||/^[1-5]$/.test(key)){
        e.preventDefault();
        e.stopPropagation();
        const commandId=presenterCommandId();
        const msg={type:'displayKey',key:key,commandId:commandId};
        markPresenterCommand(commandId);
        sendPresenterChannel(msg);
        try{ window.opener?.postMessage(Object.assign({ssgPresenter:true},msg),'*'); }catch(err){}
      }
    },{capture:true});
    window.addEventListener('beforeunload',()=>{try{window.opener?.postMessage({ssgPresenter:true,type:'controlClosed'},'*');}catch(err){} try{presenterChannel?.close();}catch(err){}});
    window.opener?.postMessage({ssgPresenter:true,type:'ready',mode:'control'},'*');

  }
  function sequenceClockNow(){
    const d=new Date();
    const h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
    return {seconds:h*3600+m*60+s,text:(h%12||12)+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'\n'+(h>=12?'PM':'AM')};
  }
  function sequenceTimeSeconds(v){return parseClockSeconds(v);}
  function sequenceStatus(t){
    const now=sequenceClockNow();const scheduled=sequenceTimeSeconds(t.scheduledTime);if(scheduled===null)return {status:'waiting',delta:0,label:''};
    let delta=now.seconds-scheduled;if(delta>43200)delta-=86400;if(delta<-43200)delta+=86400;
    if(delta>0)return {status:'overtime',delta:delta,label:'+'+formatClock(delta*1000)};
    if(delta<0)return {status:'undertime',delta:delta,label:'-'+formatClock(Math.abs(delta)*1000)};
    return {status:'on-time',delta:0,label:'ON TIME'};
  }
  function prepareTimers(){
    if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      const map={};sequenceItems(controlState.guide).forEach((it,idx)=>map[it.id]={itemId:it.id,itemNumber:it.number,title:it.title,scheduledTime:it.startTime,status:'idle',visible:idx===0,done:false});controlState.timers=map;clearInterval(controlState.interval);controlState.interval=setInterval(tickControl,500);tickControl();broadcastTimer();return;
    }
    const map={};(controlState.guide?.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{if(!map[it.id])map[it.id]={itemId:it.id,itemNumber:it.number,title:it.title,plannedMs:(parseTrtSeconds(it.trt||it.duration||'')!==null ? parseTrtSeconds(it.trt||it.duration||'') : durationSeconds(it.startTime,it.endTime))*1000,elapsedMs:0,status:'idle',startedAt:0,visible:false};}));controlState.timers=map;clearInterval(controlState.interval);controlState.interval=setInterval(tickControl,200);tickControl();
  }
  function renderControlTarget(){ const el=$('controlTarget');if(el)el.textContent='CONTROLS IN THIS WINDOW'; }
  function renderControl(){
    const g=controlState.guide;if(!g)return;
    if(String(g.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      $('controlList').innerHTML=sequenceItems(g).map((it,ii)=>`<div class="control-item" id="ctl-${escAttr(it.id)}"><div class="control-item-top"><div class="control-item-title">[TAKE ${esc(it.number||String(ii))}] ${esc(it.title)}</div><div id="ctimer-${escAttr(it.id)}" class="control-timer">--:--:--</div></div><div class="control-scheduled">SCHEDULED: ${esc(it.startTime||'—')}</div><div class="control-actions"><button class="start" onclick="startTimer('${escAttr(it.id)}')">START</button><button class="end" onclick="endTimer('${escAttr(it.id)}')">DONE</button></div><div id="cover-${escAttr(it.id)}" class="control-overtime">OVERTIME</div></div>`).join('');updateAllControlTimerViews();renderControlTarget();return;
    }
    $('controlList').innerHTML=(g.sections||[]).map((s,si)=>`<section class="control-section"><div class="control-section-head">${si+1}. ${esc(s.title)}<div class="control-section-time">${esc(s.startTime||'—')} – ${esc(s.endTime||'—')}</div></div>${(s.items||[]).map((it,ii)=>`<div class="control-item" id="ctl-${escAttr(it.id)}"><div class="control-item-top"><div class="control-item-title">#${esc(it.number||String(ii+1))} ${esc(it.title)}</div><div id="ctimer-${escAttr(it.id)}" class="control-timer">00:00:00</div></div><div class="control-actions"><button class="start" onclick="startTimer('${escAttr(it.id)}')">START</button><button class="pause" onclick="pauseTimer('${escAttr(it.id)}')">PAUSE</button><button class="end" onclick="endTimer('${escAttr(it.id)}')">END</button></div><div id="cover-${escAttr(it.id)}" class="control-overtime">OVERTIME</div></div>`).join('')}</section>`).join('');updateAllControlTimerViews();renderControlTarget();
  }
  function startTimer(id){
    const t=controlState.timers[id];if(!t)return;
    if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      if(controlState.activeId&&controlState.activeId!==id)pauseTimer(controlState.activeId);t.status='running';t.done=false;t.visible=true;controlState.activeId=id;activateControlRow(id);broadcastTimer();sendActiveItem(id);publishLiveState({guide:clone(controlState.guide),timer:timerPayload(t),activeItemId:id,target:controlState.target});updateAllControlTimerViews();return;
    }
    if(controlState.activeId&&controlState.activeId!==id)pauseTimer(controlState.activeId);if(t.status==='ended'){t.elapsedMs=0;}t.status='running';t.startedAt=Date.now()-t.elapsedMs;controlState.activeId=id;t.visible=true;activateControlRow(id);broadcastTimer();sendActiveItem(id);publishLiveState({guide:clone(controlState.guide),timer:timerPayload(t),activeItemId:id,target:controlState.target});updateAllControlTimerViews();
  }
  function pauseTimer(id){const t=controlState.timers[id];if(!t)return;if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE')return;if(t.status==='running'){t.elapsedMs=Date.now()-t.startedAt;t.status='paused';if(controlState.activeId===id)controlState.activeId='';broadcastTimer();updateAllControlTimerViews();}}
  function endTimer(id){
    const t=controlState.timers[id];if(!t)return;
    if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){t.done=true;t.status='done';t.visible=true;if(controlState.activeId===id)controlState.activeId='';const list=sequenceItems(controlState.guide);const idx=list.findIndex(x=>String(x.id)===String(id));const next=idx>=0?list[idx+1]:null;if(next&&controlState.timers[next.id]){controlState.timers[next.id].visible=true;}broadcastTimer();updateAllControlTimerViews();return;}
    if(t.status==='running')t.elapsedMs=Date.now()-t.startedAt;t.status='ended';if(controlState.activeId===id)controlState.activeId='';t.visible=true;broadcastTimer();updateAllControlTimerViews();
  }
  function tickControl(){
    if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      const id=controlState.activeId;if(id){const t=controlState.timers[id];if(t&&t.status==='running'){updateControlTimerView(t);broadcastTimer();}}else{const vals=Object.values(controlState.timers);const current=vals.find(x=>x.visible&&!x.done);if(current){updateControlTimerView(current);broadcastTimer();}}return;
    }
    const id=controlState.activeId;if(id){const t=controlState.timers[id];if(t&&t.status==='running'){t.elapsedMs=Date.now()-t.startedAt;updateControlTimerView(t);broadcastTimer();}}
  }
  function updateControlTimerView(t){
    const clock=$('ctimer-'+t.itemId);if(!clock)return;
    if(String(controlState.guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      if(t.done){clock.textContent='DONE';clock.className='control-timer done';const box=$('cover-'+t.itemId);if(box)box.classList.remove('show');return;}
      const st=sequenceStatus(t);clock.textContent=sequenceClockNow().text;clock.classList.remove('warn','overtime');const box=$('cover-'+t.itemId);if(box){box.classList.toggle('show',st.status==='overtime'||st.status==='undertime');box.textContent=st.status==='overtime'?'OVERTIME '+st.label:st.status==='undertime'?'UNDERTIME '+st.label:'';box.style.background=st.status==='undertime'?'#555':'#e51919';}return;
    }
    const remaining=Math.max(0,(t.plannedMs||0)-(t.elapsedMs||0));clock.textContent=t.overtime?('+'+formatClock((t.elapsedMs||0)-(t.plannedMs||0))):formatClock(remaining);const warn=t.plannedMs>0&&remaining<=10000&&remaining>0;const over=t.plannedMs>0&&t.elapsedMs>=t.plannedMs;clock.classList.toggle('warn',warn);clock.classList.toggle('overtime',over);const box=$('cover-'+t.itemId);if(box)box.classList.toggle('show',over);
  }
  function updateAllControlTimerViews(){Object.values(controlState.timers).forEach(updateControlTimerView);}
  function activateControlRow(id){document.querySelectorAll('.control-item').forEach(el=>el.style.outline=el.id==='ctl-'+id?'2px solid #f3c400':'none');}
  function timerPayload(t){
    if(!t)return null;
    const guide=controlState.guide||displayState.guide;
    let sectionTitle='';
    if(String(guide?.type||'PROGRAM_FLOW').toUpperCase()!=='PROGRAM_SEQUENCE'){
      for(const section of (guide?.sections||[])){if((section.items||[]).some(item=>String(item.id)===String(t.itemId))){sectionTitle=String(section.title||'');break;}}
    }
    if(String(guide?.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      const st=sequenceStatus(t);return {mode:'sequence',visible:!!t.visible,itemId:t.itemId,itemNumber:t.itemNumber,title:t.title,sectionTitle,scheduledTime:t.scheduledTime,actualClock:sequenceClockNow().text,status:t.done?'done':st.status,deltaLabel:st.label,publishedAt:Date.now()};
    }
    const elapsed=t.status==='running'?Date.now()-t.startedAt:t.elapsedMs;const remaining=t.plannedMs>0?Math.max(0,t.plannedMs-elapsed):0;return {mode:'flow',visible:!!t.visible,itemId:t.itemId,itemNumber:t.itemNumber,title:t.title,sectionTitle,elapsedMs:elapsed,plannedMs:t.plannedMs,status:t.status,publishedAt:Date.now(),warn:t.plannedMs>0&&remaining<=10000&&elapsed<t.plannedMs,overtime:t.plannedMs>0&&elapsed>=t.plannedMs};
  }
  function broadcastTimer(){const t=controlState.activeId?controlState.timers[controlState.activeId]:lastVisibleTimer();const payload=timerPayload(t);controlPreviewState.timer=payload;renderControlPreviewTimer();if(APP_CONFIG.mode==='display'){displayState.timer=payload;renderDisplayTimer();}sendToPresenterMode('display','timerState',{payload:payload});}
  function lastVisibleTimer(){const vals=Object.values(controlState.timers).filter(t=>t.visible);return vals.length?vals[vals.length-1]:null;}
  function sendActiveItem(id){controlPreviewState.activeItemId=id;setControlPreviewActiveItem(id);if(APP_CONFIG.mode==='display')setActiveDisplayItem(id);sendToPresenterMode('display','activeItem',{payload:{itemId:id}});}
  /* Export the same formatted preview in two columns, instead of rebuilding it as plain text. */
  function downloadGuideImage(guide){
    const count=String(buildText(guide)||'').length;const fs=count>10000?10:count>7500?11:count>5000?12:count>3000?13:count>1500?14:15;
    const wrapper=document.createElement('div');wrapper.style.cssText='position:fixed;left:-100000px;top:0;width:1400px;background:#fff;padding:36px;z-index:-1;';
    wrapper.innerHTML=`${exportGuideStyles()}<div id="imageExportTarget" class="export-render" style="--export-font-size:${fs}pt;width:100%;column-count:2;column-gap:24px">${previewHTML(guide)}</div>`;document.body.appendChild(wrapper);
    const capture=()=>{
      const target=wrapper.querySelector('#imageExportTarget');
      if(window.html2canvas){window.html2canvas(target,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false}).then(canvas=>{canvas.toBlob(blob=>{if(blob)downloadBlobFile(blob,exportFileBase(guide)+'.png');wrapper.remove();hideToast();},'image/png');}).catch(()=>{wrapper.remove();hideToast();showToast('Image export failed. Please try again.');});return;}
      const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';script.onload=()=>{window.html2canvas(target,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false}).then(canvas=>canvas.toBlob(blob=>{if(blob)downloadBlobFile(blob,exportFileBase(guide)+'.png');wrapper.remove();hideToast();},'image/png')).catch(()=>{wrapper.remove();hideToast();showToast('Image export failed. Please try again.');});};script.onerror=()=>{wrapper.remove();hideToast();showToast('Could not load the image export library. Check your internet connection and try again.');};document.head.appendChild(script);
    };
    showToast('Preparing image...');
    if(window.html2canvas){capture();return;}
    const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';script.onload=capture;script.onerror=()=>{wrapper.remove();hideToast();showToast('Could not load the image export library. Check your internet connection and try again.');};document.head.appendChild(script);
  }

  // Initialize the correct window mode.
  init();
</script>
