<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSG Program Operator Tool</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
  <link rel="shortcut icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./favicon.png">
  <style>
    *{box-sizing:border-box}
    :root{--blue:#073763;--blue2:#0b4d87;--yellow:#f3c400;--bg:#f5f7fa;--line:#d9e0e7;--text:#17202a;--muted:#66717e;--red:#d71920;--green:#17823b}
    html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .app{display:flex;min-height:100vh}
    .sidebar{width:245px;background:#fff;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
    .brand{font-weight:800;color:var(--blue);font-size:17px;line-height:1.15}
    .brand small{display:block;color:var(--muted);font-size:10px;font-weight:700;margin-top:4px}
    .nav{display:flex;flex-direction:column;gap:7px}
    .nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:8px;color:#34404b;font-weight:700;font-size:13px}
    .nav button:hover,.nav button.active{background:#edf3f9;color:var(--blue)}
    body.viewer-mode .nav button:not([data-page="home"]){display:none}
    body.viewer-mode .ssg-tools-grid,body.viewer-mode .ssg-dashboard-columns{display:none!important}
    body.viewer-mode .ssg-home-intro p{max-width:760px}
    .operator-follow-modal{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:10000;display:none;align-items:center;justify-content:center;padding:18px}.operator-follow-modal.show{display:flex}.operator-follow-card{background:#fff;color:#182433;border-radius:14px;padding:22px;width:min(560px,100%);max-height:80vh;overflow:auto;box-shadow:0 20px 60px #0004}.operator-follow-card h3{margin:0 0 8px}.operator-follow-list{display:grid;gap:8px;margin-top:14px}.operator-follow-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #dce2e8;border-radius:9px;padding:12px}.operator-follow-empty{padding:16px;background:#f4f6f8;border-radius:8px;color:#596675;font-size:13px}
    body.viewer-display-mode .display-key,body.viewer-display-mode .display-controls{display:none!important}
    .officer-request-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:10px;padding:16px;margin:18px 0}
    .officer-request-card h3{margin:0 0 6px;color:var(--blue)}
    .officer-request-card p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.5}
    .officer-request-card .request-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto;gap:10px;align-items:end}
    .officer-request-card .request-field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
    .officer-request-card .request-field input,.officer-request-card .request-field select{min-height:42px}
    .officer-request-status{font-size:12px;margin-top:8px;color:var(--green)}
    @media(max-width:640px){.officer-request-card .request-row{grid-template-columns:1fr}}
    body.viewer-display-mode .display-shell{grid-template-columns:minmax(0,1fr) minmax(260px,30vw)!important;gap:0!important}
    body.viewer-display-mode #promptResizeHandle,body.viewer-display-mode .display-key,body.viewer-display-mode .display-controls{display:none!important}
    body.viewer-display-mode .display-main{width:auto;min-width:0;height:100vh}
    body.viewer-display-mode .display-side{display:flex!important;min-width:0;height:100vh;border-left:1px solid #30343a}
    body.viewer-display-mode .display-control-pane,body.viewer-display-mode #timerResizeHandle{display:none!important}
    body.viewer-display-mode .display-timer-pane{flex:1;min-height:0;border:0!important}
    body.viewer-display-mode .display-timer{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
    body.viewer-display-mode #displayTimerClock{font-size:clamp(32px,5vw,76px)}
    @media(max-width:760px){body.viewer-display-mode .display-shell{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr) minmax(190px,30vh)!important}body.viewer-display-mode .display-main{height:70vh}body.viewer-display-mode .display-side{height:30vh;border-left:0;border-top:1px solid #30343a}body.viewer-display-mode .display-timer{padding:10px}body.viewer-display-mode #displayTimerClock{font-size:clamp(28px,7vw,52px)}}
    .sidebar-foot{margin-top:auto;color:#8b96a2;font-size:10px;line-height:1.5}
    .main{flex:1;min-width:0}
    .topbar{padding:18px 22px;border-bottom:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;gap:14px;align-items:center}
    .topbar h1{margin:0;font-size:20px;color:var(--blue);font-family:Arial,Helvetica,sans-serif}
    .topbar p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .content{padding:20px;max-width:1500px;margin:0 auto}
    .page{display:none}
    .page.active{display:block}
    .toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .toolbar-left,.toolbar-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .search,input,select,textarea{border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);outline:none}
    .search{min-width:260px;padding:10px 11px}
    input,select,textarea{width:100%;padding:10px 11px}
    textarea{min-height:88px;resize:vertical}
    input:focus,select:focus,textarea:focus,.search:focus{border-color:var(--blue2);box-shadow:0 0 0 2px rgba(7,55,99,.08)}
    .btn{border:1px solid var(--line);background:#fff;color:#27313a;border-radius:7px;padding:9px 12px;font-weight:700;font-size:12px}
    .btn:hover{background:#f3f6f8}
    .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .btn.primary:hover{background:var(--blue2)}
    .btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#111}
    .btn.danger{background:#fff5f5;color:var(--red);border-color:#f0c0c3}
    .btn.small{padding:6px 9px;font-size:11px}
    .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
    .guide-list{display:flex;flex-direction:column;gap:10px}
    .guide-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:13px;border-radius:9px;background:#fff}
    .guide-info{flex:1;min-width:0}.guide-title{font-weight:800;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.guide-meta{color:var(--muted);font-size:11px;margin-top:4px}
    .empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;background:#fff}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;color:#4f5b67;margin-bottom:5px}
    .section-card{border:1px solid #cfd8e1;border-radius:9px;padding:13px;background:#fbfcfd;margin-top:12px}
    .section-header,.item-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.section-header strong{color:var(--blue);font-size:13px}.item-header strong{font-size:12px}
    .item-card{border:1px solid #dde4ea;border-radius:8px;padding:12px;background:#fff;margin-top:10px}.item-card.ssg-dragging,.sequence-template-card.ssg-dragging{opacity:.42}.item-card.ssg-drop-target,.sequence-template-card.ssg-drop-target{outline:2px dashed #1687d9;outline-offset:3px}.item-card .form-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.item-reorder-tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.item-reorder-tools .btn{min-width:30px;padding:4px 7px}.item-drag-handle,.sequence-drag-handle{cursor:grab;touch-action:none;font-weight:900;user-select:none}.item-drag-handle:active,.sequence-drag-handle:active{cursor:grabbing}
    .trt-preview{font-size:11px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:7px;background:#fafbfd}.time-auto{background:#f3f5f7;color:#69737d}.time-auto:disabled{opacity:1;cursor:not-allowed}
    .sticky-actions{position:sticky;bottom:0;z-index:10;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px -0px 0;margin-top:14px;display:flex;justify-content:flex-end;gap:8px}
    .editor-workspace{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:14px;align-items:start}
    .editor-pane{min-width:0}.live-preview-wrap{min-width:0;position:sticky;top:14px}
    .live-preview{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(24,42,60,.06)}
    .live-preview-head{padding:12px 14px;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .live-preview-head strong{font-size:12px;letter-spacing:.2px}.live-preview-badge{font-size:9px;font-weight:900;background:#f3c400;color:#111;padding:4px 7px;border-radius:999px}
    .live-preview-body{max-height:calc(100vh - 120px);overflow:auto;padding:16px;background:#fafbfc}
    .live-preview-title{font-size:18px;font-weight:900;color:var(--blue);line-height:1.15;margin-bottom:4px}.live-preview-meta{font-size:10px;color:var(--muted);margin-bottom:14px}
    .live-preview-section{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:10px}.live-preview-section h3{font-size:12px;color:var(--blue);margin:0 0 4px}.live-preview-section-time{font-size:10px;color:var(--muted);margin-bottom:9px}
    .live-preview-item{padding:8px 0;border-top:1px solid #edf0f3}.live-preview-item:first-of-type{border-top:0}.live-preview-item-title{font-size:11px;font-weight:800;line-height:1.35}.live-preview-item-line{font-size:9px;color:#66727f;margin-top:3px}.live-preview-note{font-size:9px;color:#8a6000;margin-top:4px;line-height:1.35}

    /* PROGRAM SEQUENCE — exact prompter template styling */
    .sequence-editor-workspace .editor-pane{min-width:0}
    .sequence-editor-workspace #sequenceItemsRoot{display:flex;flex-direction:column;gap:20px}
    .sequence-template-card{position:relative;background:#000;border:0;border-radius:0;overflow:visible;padding:0;margin:0;box-shadow:none;color:#fff}
    .sequence-template-take{display:flex;align-items:center;gap:0;background:#ffc400;color:#111;min-height:31px;font-weight:900;padding:0 8px;font-size:18px;line-height:1.15}
    .sequence-template-take .seq-number{width:36px;flex:0 0 36px;background:transparent;border:0;box-shadow:none;color:#111;font-weight:900;font-size:18px;padding:0;text-align:center;border-radius:0}
    .sequence-template-take .seq-time{width:190px;margin-left:3px;background:transparent;border:0;box-shadow:none;color:#111;font-weight:900;font-size:18px;padding:0;text-align:left;border-radius:0}
    .sequence-template-take .seq-time::placeholder{color:#b8b8b8;opacity:1}
        .sequence-template-take input:focus{outline:none;box-shadow:none}
    .sequence-template-spec{display:flex;align-items:center;background:#dcefd6;min-height:31px;padding:0 8px;color:#0878c8}
    .sequence-template-spec .spec-prefix{flex:0 0 auto;color:#0878c8;font-weight:900;font-size:18px;line-height:1.15}
    .sequence-template-spec .seq-title{display:block;width:100%;background:transparent;border:0;box-shadow:none;color:#0878c8;font-weight:900;font-size:18px;padding:0;resize:none;min-height:31px;line-height:1.15;border-radius:0}
    .sequence-template-spec .seq-title::placeholder{color:#a9b4bd;opacity:1}
    .sequence-template-spec .seq-title:focus{outline:none;box-shadow:none}
    .sequence-template-detail-wrap{background:#000;min-height:42px}
    .sequence-template-script-wrap{background:#000;min-height:52px;margin-top:2px}
    .sequence-template-script{display:block;width:100%;min-height:52px;box-sizing:border-box;background:#000;border:0;box-shadow:none;color:#fff;caret-color:#fff;font-weight:400;font-size:18px;line-height:1.15;padding:4px 8px;resize:vertical;outline:none;overflow:auto;border-radius:0}
    .sequence-template-script::placeholder{color:#a9a9a9;opacity:1}
    .sequence-script-marker{font-weight:900;font-style:italic;color:#fff}
    .sequence-action-script{font-style:italic;color:#e51919;font-weight:900}

    .sequence-template-detail{display:block;width:100%;min-height:42px;box-sizing:border-box;background:#000;border:0;box-shadow:none;color:#fff;caret-color:#fff;font-weight:400;font-size:18px;line-height:1.15;padding:0 8px;resize:vertical;outline:none;overflow:auto;border-radius:0}
    .sequence-template-detail::placeholder{color:#a9a9a9;opacity:1}
    .sequence-format-line{min-height:21px;line-height:1.5;margin-bottom:1.5em;white-space:pre-wrap;text-align:justify}.sequence-format-line + .sequence-format-line{margin-top:0}
    .sequence-format-oncam{display:flex;align-items:flex-start;gap:0;line-height:1.15}
    .sequence-format-oncam-label{color:#00b85a;font-weight:900;flex:0 0 120px}
    .sequence-format-oncam-name{color:#fff;font-weight:900;min-width:0;flex:1}
    .sequence-format-oncam-cont{margin-left:120px;color:#fff;font-weight:900;line-height:1.15}
    .sequence-template-media,.sequence-template-link,.sequence-template-notes{display:none!important}
    .sequence-template-remove{position:static!important;margin-left:auto!important;flex:0 0 auto!important;border:0!important;background:#222!important;color:#fff!important;border-radius:4px!important;padding:3px 7px!important;font-size:9px!important;z-index:5}

    /* Program Sequence — requested typography/host formatting */
    .sequence-prompt-preview .sequence-preview-detail,.sequence-preview-oncam-cont,.sequence-preview-text-cont,.sequence-preview-script-marker{font-weight:400;line-height:1.5;margin-bottom:1.5em;white-space:pre-wrap;text-align:justify}
    .sequence-prompt-preview .sequence-preview-oncam-label{font-weight:400}
    .sequence-prompt-preview .sequence-preview-oncam-name{font-weight:400}
    .sequence-prompt-preview .sequence-preview-takebar,.sequence-prompt-preview .sequence-preview-spec{font-weight:900}
    .sequence-host-name{font-weight:900}
    .sequence-tech-instruction{font-weight:900;color:#e51919;font-style:italic;text-align:justify}
    .sequence-host-instruction{font-weight:900;color:#000;background:#39ff14;font-style:italic;padding:0 2px;display:inline}
    .sequence-script-line{font-weight:400}
    .sequence-host-row{display:flex;align-items:center;gap:8px;margin-top:8px}
    .sequence-host-row input{flex:1}
    .sequence-host-row select{width:150px}
    .sequence-host-color{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.35)}
    /* Program Sequence preview / prompt — same template */
    .sequence-prompt-preview{background:#000;color:#fff;padding:0;border-radius:0}
    .sequence-prompt-preview .sequence-preview-header{margin:0 0 20px}
    .sequence-prompt-preview .sequence-preview-program-title{color:#0878c8;font-weight:900;font-size:18px;line-height:1.15;margin:0 0 4px;text-align:justify}
    .sequence-prompt-preview .sequence-preview-program-meta:empty{display:none}.sequence-prompt-preview .sequence-preview-program-meta{color:#fff;font-weight:400;font-size:18px;line-height:1.15;margin:0 0 2px;text-align:justify}
    .sequence-prompt-preview .sequence-preview-take{margin:0 0 20px}
    .sequence-prompt-preview .sequence-preview-takebar{background:#ffc400;color:#111;font-weight:900;padding:0 8px;min-height:31px;font-size:18px;line-height:1.15;text-align:justify}
    .sequence-prompt-preview .sequence-preview-spec{background:#dcefd6;color:#0878c8;font-weight:900;padding:0 8px;min-height:31px;font-size:18px;line-height:1.15;text-align:justify}
    .sequence-prompt-preview .sequence-preview-detail{color:#fff;font-weight:400;padding:0 8px;font-size:18px;line-height:1.15;white-space:pre-wrap;text-align:justify;margin:0}

    .sequence-preview-oncam-label{color:#00b85a;font-weight:900;flex:0 0 120px}
    .sequence-preview-oncam-name{color:#fff;font-weight:400;min-width:0;flex:1}
    .sequence-preview-oncam-cont{margin-left:120px;color:#fff;font-weight:400;padding:0;font-size:18px;line-height:1.15;text-align:justify}
    .sequence-preview-script-marker{color:#fff;font-style:italic;font-weight:400;padding:2px 8px;font-size:18px;line-height:1.15;text-align:justify}.sequence-preview-action-script{color:#e51919;font-style:italic;font-weight:900;padding:2px 8px;font-size:18px;line-height:1.15;text-align:justify}
    .sequence-text-name{font-weight:900;color:#fff;padding:2px 8px;font-size:18px;line-height:1.5;margin-bottom:.35em} .sequence-editor-workspace textarea,.sequence-editor-workspace input{font-family:Tahoma,Arial,sans-serif;text-transform:uppercase}
    .sequence-prompt-preview,.sequence-prompt-display,.sequence-editor-workspace #sequencePreviewBody{font-family:Tahoma,Arial,sans-serif;text-transform:uppercase}
    .sequence-display-header{font-family:Tahoma,Arial,sans-serif!important;text-transform:uppercase}
    .sequence-host-instruction{font-weight:400!important;color:#000!important;background:#39ff14;font-style:italic;padding:0 2px;display:inline}
    .sequence-script-bold{font-weight:900}
    .sequence-script-plain{font-weight:400}
    .sequence-host-name{font-weight:900!important}
    .sequence-text-cont{font-weight:400;color:#fff;padding:2px 8px 2px 8px;margin-left:32px;font-size:18px;line-height:1.5;margin-bottom:.35em}
    .sequence-display-text-name,.sequence-display-text-cont{font-size:clamp(18px,2.1vw,34px);line-height:1.5;margin-bottom:.35em}
    .sequence-display-text-name{font-weight:400;color:#fff;padding:2px 0;text-align:justify}
    .sequence-display-text-cont{font-weight:400;color:#fff;padding:2px 0;margin-left:34px;text-align:justify}
    .sequence-display-detail,.sequence-display-oncam,.sequence-display-oncam-cont,.sequence-display-script-marker,.sequence-display-action-script{font-size:18px;text-align:justify}
    .sequence-display-oncam-name{font-weight:400}
    .sequence-preview-text-name{font-weight:900;color:#fff;padding:2px 8px;font-size:18px;line-height:1.5;margin-bottom:.35em}
    .sequence-preview-text-cont{font-weight:400;color:#fff;padding:2px 8px;margin-left:32px;font-size:18px;line-height:1.5;margin-bottom:.35em}
    .sequence-preview-end{background:#c9e7f5;color:#0878c8;font-weight:900;padding:0 8px;min-height:31px;font-size:18px;line-height:1.15;text-align:justify}
    .sequence-preview-endnote{background:#073763;color:#fff;font-weight:900;padding:5px 8px;font-size:18px;line-height:1.15;text-align:justify}

    .sequence-display-oncam{display:flex;align-items:flex-start;padding:0;font-size:clamp(12px,2.2vw,24px);line-height:1.15}
    .sequence-display-oncam-label{color:#00b85a;font-weight:900;flex:0 0 120px}
    .sequence-display-oncam-name{color:#fff;font-weight:900;min-width:0;flex:1}
    .sequence-display-oncam-cont{margin-left:120px;color:#fff;font-weight:900;padding:0;font-size:clamp(12px,2.2vw,24px);line-height:1.15}
    .sequence-display-detail{color:#fff;font-weight:900;padding:0;font-size:clamp(12px,2.2vw,24px);line-height:1.15;white-space:pre-wrap}
    .sequence-display-take{background:#ffc400;color:#111;font-weight:900;font-size:clamp(17px,2.2vw,38px);line-height:1.15;padding:0 8px;min-height:31px}

    .sequence-display-script-marker{color:#fff;font-style:italic;font-weight:900;padding:2px 0;font-size:clamp(15px,1.9vw,32px);line-height:1.18}.sequence-display-action-script{color:#e51919;font-style:italic;font-weight:900;padding:2px 0;font-size:clamp(15px,1.9vw,32px);line-height:1.18}

    .preview-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
    .preview-title{font-size:20px;font-weight:800;color:var(--blue)}.preview-meta{color:var(--muted);font-size:12px;line-height:1.6}

 .ssg-home-intro h2{font-size:clamp(23px,6.4vw,27px)!important;line-height:1.16!important;letter-spacing:-.035em!important;margin:0 0 10px!important;max-width:100%!important;overflow-wrap:normal!important;word-break:normal!important;text-wrap:pretty}
 .ssg-home-intro p{font-size:13px!important;line-height:1.5!important;margin:0!important;max-width:100%!important;overflow-wrap:break-word!important}
 .ssg-home-badge{align-self:flex-start!important;display:inline-flex!important;padding:10px 12px!important;border-radius:14px!important}
 .ssg-home-badge>span{width:30px!important;height:30px!important}
 .ssg-tools-grid{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:10px!important;margin-bottom:30px!important}
 .ssg-tool-card{display:grid!important;grid-template-columns:40px minmax(0,1fr)!important;grid-template-rows:auto auto!important;align-items:center!important;gap:4px 12px!important;min-height:0!important;padding:15px!important;border-radius:16px!important;text-align:left!important}
 .ssg-tool-icon{grid-column:1!important;grid-row:1 / span 2!important;width:40px!important;height:40px!important;border-radius:12px!important;font-size:19px!important}
 .ssg-tool-card strong{grid-column:2!important;font-size:14px!important;line-height:1.3!important;padding-right:22px!important}
 .ssg-tool-card small{grid-column:2!important;font-size:11px!important;line-height:1.45!important;max-width:none!important;padding-right:8px!important}
 .ssg-tool-arrow{right:13px!important;top:14px!important;font-size:16px!important}
 .ssg-dashboard-columns{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:22px!important}
 .ssg-dashboard-panel .ssg-section-title{display:flex!important;align-items:flex-start!important;justify-content:space-between!important;gap:10px!important;margin-bottom:12px!important}
 .ssg-dashboard-panel .ssg-section-title h2{font-size:16px!important;margin:0!important}
 .ssg-dashboard-panel .ssg-section-title p{font-size:11px!important;line-height:1.4!important;margin-top:4px!important}
 .ssg-text-link{font-size:11px!important;min-height:36px!important;padding:5px 0!important;white-space:nowrap!important}
 .ssg-panel-inner{padding:12px!important;border-radius:15px!important}
 .ssg-search-row{margin-bottom:10px!important}
 .ssg-search-row .search{padding:12px!important;font-size:12px!important;border-radius:12px!important}
 .ssg-dashboard-panel .guide-row{display:flex!important;flex-direction:row!important;align-items:center!important;flex-wrap:wrap!important;gap:9px!important;padding:11px!important;border-radius:12px!important}
 .ssg-dashboard-panel .guide-row .actions{width:100%!important;margin:0!important;padding-left:47px!important;gap:7px!important}
 .ssg-dashboard-panel .guide-row .actions .btn{flex:1!important;min-height:36px!important}
 .ssg-type-pill{font-size:9px!important;margin-left:auto!important}
 .ssg-workspace-tip{padding:14px!important;border-radius:13px!important}
}
/* Three canonical responsive modes selected from the actual available viewport. */

}

html[data-ssg-layout="phone"] .ssg-dashboard-columns{grid-template-columns:minmax(0,1fr)!important}

<script>
  const APP_CONFIG = window.SSG_APP_CONFIG || {mode: new URLSearchParams(location.search).get('mode') || 'main', guideId: new URLSearchParams(location.search).get('guideId') || '', appUrl: location.origin + location.pathname};
  // Full-screen keyboard support for every display/prompter window.
  // Browser security requires a user gesture; Ctrl+Shift+F is the explicit gesture.
  (function installPrompterFullscreenShortcut(){
    const mode = APP_CONFIG.mode;
    if(!['host','display','lyric-display'].includes(mode)) return;
    window.addEventListener('keydown', function(event){
      if(event.ctrlKey && event.shiftKey && !event.altKey && String(event.key||'').toLowerCase()==='f'){
        event.preventDefault();
        event.stopPropagation();
        if(document.fullscreenElement) return;
        const root = document.documentElement;
        const enter = root.requestFullscreen || root.webkitRequestFullscreen;
        if(typeof enter !== 'function'){
          console.warn('Full screen is not supported by this browser.');
          return;
        }
        try{
          const result = enter.call(root, {navigationUI:'hide'});
          if(result && typeof result.catch === 'function') result.catch(function(err){console.warn('Unable to enter full screen:',err);});
        }catch(err){
          try{const fallback=enter.call(root);if(fallback&&typeof fallback.catch==='function')fallback.catch(function(e){console.warn('Unable to enter full screen:',e);});}catch(e){console.warn('Unable to enter full screen:',e);}
        }
      }
      // Escape is intentionally not intercepted: the browser exits full screen natively.
    }, true);
  })();
</script>

  function handleAuthFailure(message){
    console.error(message);
    try{ localStorage.removeItem(AUTH_STORAGE_KEY); }catch(err){}
    state.auth=null;
    if(APP_CONFIG.mode==='main') showLoginGate(message);
    else {
      document.body.innerHTML='<div class="auth-gate"><div class="auth-card"><div class="auth-brand">SSG PROGRAM GUIDE BUILDER<small>SESSION ENDED</small></div><p class="auth-sub">Your session is no longer valid. Please close this window and sign in again from the main app.</p></div></div>';
    }
  }
  function handleError(err){
    console.error(err);
    const message=(err && err.message) ? err.message : String(err);
    if(/^AUTH_(REQUIRED|BLOCKED|FORBIDDEN|LOCKED|GOOGLE_UNAVAILABLE|INVALID):/.test(message)){
      if(/^AUTH_(REQUIRED|BLOCKED):/.test(message)) handleAuthFailure(message.replace(/^AUTH_[A-Z_]+:\s*/,'').trim());
      else showAuthError(message.replace(/^AUTH_[A-Z_]+:\s*/,'').trim());
      return;
    }
    showToast(message);
  }
  function safeRun(method, args, ok){
    const token=state.auth?.token || getStoredAuth()?.token || '';
    if(!token){ handleAuthFailure('Please sign in first.'); return; }
    const runner=google.script.run
      .withSuccessHandler(ok || function(){})
      .withFailureHandler(handleError);
    runner.apiCall(method, Array.isArray(args)?args:[args], token);
  }

  }

  }

  function parseClockSeconds(value){
    const s=String(value||'').trim().toUpperCase();
    if(!s)return null;
    const m=s.match(/^(\d{1,2})(?::(\d{2}))?(?::(\d{2}))?\s*(AM|PM)?$/);
    if(!m)return null;
    let h=Number(m[1]), min=Number(m[2]||0), sec=Number(m[3]||0), ap=m[4]||'';
    if(min>59||sec>59)return null;
    if(ap){
      if(h<1||h>12)return null;
      if(ap==='AM'&&h===12)h=0;
      if(ap==='PM'&&h!==12)h+=12;
    }else if(h>23)return null;
    return h*3600+min*60+sec;
  }

  function parseTrtSeconds(value){
    const s=String(value||'').trim().toUpperCase();
    if(!s)return null;

    // Flexible clock-style TRT: MM:SS or H:MM:SS.
    let m=s.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/);
    if(m){
      if(m[3]!==undefined){
        const h=Number(m[1]), min=Number(m[2]), sec=Number(m[3]);
        if(min>59||sec>59)return null;
        return h*3600+min*60+sec;
      }
      const min=Number(m[1]), sec=Number(m[2]);
      if(sec>59)return null;
      return min*60+sec;
    }

    let total=0, found=false;
    const hr=s.match(/(\d+(?:\.\d+)?)\s*(?:H|HR|HRS|HOUR|HOURS)\b/);
    const min=s.match(/(\d+(?:\.\d+)?)\s*(?:M|MIN|MINS|MINUTE|MINUTES)\b/);
    const sec=s.match(/(\d+(?:\.\d+)?)\s*(?:S|SEC|SECS|SECOND|SECONDS)\b/);
    if(hr){total+=Number(hr[1])*3600;found=true;}
    if(min){total+=Number(min[1])*60;found=true;}
    if(sec){total+=Number(sec[1]);found=true;}
    return found?Math.round(total):null;
  }

  function formatTrtSeconds(seconds){
    if(seconds===null||seconds===undefined||isNaN(seconds)||seconds<0)return '';
    seconds=Math.round(seconds);
    const h=Math.floor(seconds/3600);
    const rem=seconds%3600;
    const m=Math.floor(rem/60);
    const s=rem%60;
    if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function formatClockSeconds(seconds){
    if(seconds===null||seconds===undefined||isNaN(seconds))return '';
    seconds=((Math.round(seconds)%86400)+86400)%86400;
    let h=Math.floor(seconds/3600);
    const m=Math.floor((seconds%3600)/60);
    const sec=seconds%60;
    const ap=h>=12?'PM':'AM';
    h=h%12||12;
    return h+':'+String(m).padStart(2,'0')+(sec?':'+String(sec).padStart(2,'0'):'')+' '+ap;
  }

  function trtSecondsFromItemObject(item){
    return parseTrtSeconds(item?.trt||item?.duration||'');
  }

  function trtDisplay(item){
    const direct=parseTrtSeconds(item?.trt||item?.duration||'');
    if(direct!==null)return formatTrtSeconds(direct);
    const a=parseClockSeconds(item?.startTime), b=parseClockSeconds(item?.endTime);
    if(a===null||b===null)return '';
    let d=b-a;if(d<0)d+=86400;
    return formatTrtSeconds(d);
  }

  function durationParts(start,end){
    const a=parseClockSeconds(start), b=parseClockSeconds(end);
    if(a===null||b===null)return '';
    let d=b-a;if(d<0)d+=86400;
    return formatTrtSeconds(d);
  }

  function durationSeconds(start,end){
    const a=parseClockSeconds(start), b=parseClockSeconds(end);
    if(a===null||b===null)return 0;
    let d=b-a;if(d<0)d+=86400;
    return d;
  }

  function formatClock(ms){
    let total=Math.max(0,Math.floor(ms/1000));
    const h=Math.floor(total/3600); total%=3600; const m=Math.floor(total/60); const s=total%60;
    return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
  }

  function hydrateGuideForEditor(g){
    if(!g)return g;
    g.sections=(g.sections||[]).map(function(sec,si){
      const out=Object.assign({},sec);
      out.items=(sec.items||[]).map(function(it){
        const item=Object.assign({},it);
        if(!item.trt){
          const d=durationSeconds(item.startTime,item.endTime);
          item.trt=d?formatTrtSeconds(d):'';
        }else{
          const d=parseTrtSeconds(item.trt);
          if(d!==null)item.trt=formatTrtSeconds(d);
        }
        return item;
      });
      if(typeof out._manualEnd!=='boolean'){
        const last=out.items.length?out.items[out.items.length-1]:null;
        const derived=last?.endTime||'';
        const a=parseClockSeconds(out.endTime),b=parseClockSeconds(derived);
        out._manualEnd=!!out.endTime && (a===null||b===null||a!==b);
      }
      return out;
    });
    return g;
  }

  function recalculateEditorTimes(){
    const sections=Array.from(document.querySelectorAll('.section-card'));
    let previousSectionEnd=null;

    sections.forEach(function(card,sidx){
      const startInput=card.querySelector('.sec-start');
      const endInput=card.querySelector('.sec-end');
      const manualEnd=card.dataset.manualEnd==='1';

      if(sidx===0){
        previousSectionEnd=parseClockSeconds(startInput?.value||'');
      }else{
        const autoStart=previousSectionEnd;
        if(startInput){
          startInput.value=autoStart===null?'':formatClockSeconds(autoStart);
          startInput.disabled=true;
          startInput.classList.add('time-auto');
        }
      }

      let cursor=parseClockSeconds(startInput?.value||'');

      Array.from(card.querySelectorAll('.item-card')).forEach(function(itemCard){
        const startEl=itemCard.querySelector('.item-start');
        const endEl=itemCard.querySelector('.item-end');
        const trtEl=itemCard.querySelector('.item-trt-input');
        const seconds=parseTrtSeconds(trtEl?.value||'');

        if(startEl){
          startEl.value=cursor===null?'':formatClockSeconds(cursor);
          startEl.readOnly=true;
          startEl.classList.add('time-auto');
        }

        if(seconds!==null && cursor!==null){
          const end=cursor+seconds;
          if(endEl)endEl.value=formatClockSeconds(end);
          cursor=end;
        }else{
          if(endEl)endEl.value='';
          cursor=null;
        }

        if(trtEl && seconds!==null){
          trtEl.value=formatTrtSeconds(seconds);
        }
      });

      if(endInput && !manualEnd && cursor!==null){
        endInput.value=formatClockSeconds(cursor);
      }

      previousSectionEnd=parseClockSeconds(endInput?.value||'');
    });

    syncGuide();
    renderLivePreview();
  }

  function presenterCommandId(){ return uid('CMD'); }
  function markPresenterCommand(id){
    if(!id) return true;
    if(presenterSeenCommands.has(id)) return false;
    presenterSeenCommands.add(id);
    if(presenterSeenCommands.size>300){
      const first=presenterSeenCommands.values().next().value;
      presenterSeenCommands.delete(first);
    }
    return true;

  function openLyricChannel(){
    try{
      lyricChannel = new BroadcastChannel(LYRIC_CHANNEL_NAME);
      lyricChannel.onmessage = function(ev){
        const d=ev.data||{};
        if(!d || d.ssgLyricChannel!==true) return;
        if(APP_CONFIG.mode==='lyric-display'){
          if(d.type==='state') applyLyricDisplayPayload(d.payload||{});
          if(d.type==='ready') sendLyricDisplayReady();
        }else if(APP_CONFIG.mode==='main'){
          if(d.type==='ready'){
            startLyricDisplayHandshake();
            sendLyricState();
          }
          if(d.type==='navigate'){
            const direction=d.direction || d.payload?.direction || '';
            if(direction==='prev') prevLyricBlock();
            if(direction==='next') nextLyricBlock();
          }
          if(d.type==='settings'){
            applyLyricRemoteSettings(d.settings || d.payload || {});
          }
          if(d.type==='background'){
            applyLyricBackgroundIndex(d.backgroundIndex ?? d.payload?.backgroundIndex ?? -1,true,d.scrollTop ?? d.payload?.scrollTop);
          }
          // No generic lyric keyboard controls are accepted by MAIN.
          // DISPLAY handles its own play/scroll/background controls locally.
        }
      };
    }catch(err){
      lyricChannel=null;
      console.warn('Lyric BroadcastChannel unavailable:',err);
    }
  }
  function sendLyricChannel(type,payload){
    try{
      if(lyricChannel){
        lyricChannel.postMessage({ssgLyricChannel:true,type:type,payload:payload||null});
        return true;
      }
    }catch(err){}
    return false;
  }
  function sendLyricDisplayReady(){ sendLyricChannel('ready'); }

  function openPresenterChannel(){
    if(presenterChannel)return;
    try{
      presenterChannel = new BroadcastChannel(PRESENTER_CHANNEL_NAME);
      presenterChannel.onmessage = function(ev){
        const d=ev.data||{};
        if(!d || d.ssgPresenterChannel!==true) return;
        handlePresenterChannelMessage(d);
      };
    }catch(err){
      presenterChannel = null;
      console.warn('BroadcastChannel unavailable:', err);
    }
  }
  function sendPresenterChannel(message){
    try{ if(presenterChannel) presenterChannel.postMessage(Object.assign({ssgPresenterChannel:true},message)); }catch(err){}
  }
  function handlePresenterChannelMessage(d){
    if(!markPresenterCommand(d.commandId)) return;
    if(APP_CONFIG.mode==='host'){
      if(d.type==='guide' && d.guide && String(d.guide.id||'')===String(APP_CONFIG.guideId||'')){
        // Keep Host View live while preserving its current scroll position.
        const area=$('displayContent');
        const oldTop=area?area.scrollTop:0;
        displayState.guide=d.guide;
        renderDisplay({preserveScroll:true});
        applyDisplayZoom();
        updateHostZoomLabel();
        const refreshedArea=$('displayContent');
        if(refreshedArea) refreshedArea.scrollTop=oldTop;
      }
    }else if(APP_CONFIG.mode==='display'){
      if(d.type==='guide' && d.guide){
        displayState.guide=d.guide;
        renderDisplay({preserveScroll:true});
        controlState.guide=d.guide;
        prepareTimers();
        renderControl();
      }else if(d.type==='targetState' && d.target){
        displayState.target=d.target; updateDisplayTarget();
      }else if(d.type==='timerState'){
        displayState.timer=d.payload; renderDisplayTimer();
      }else if(d.type==='activeItem'){
        setActiveDisplayItem(d.payload?.itemId||'');
      }else if(d.type==='displayKey'){
        handleDisplayKey(d.key);
      }
    }else if(APP_CONFIG.mode==='control'){
      if(d.type==='targetState' && d.target){
        controlState.target=d.target; renderControlTarget();
      }
    }
  }
  function sendPresenterCommand(type,payload){
    const commandId=presenterCommandId();
    const msg=Object.assign({type:type,commandId:commandId},payload||{});
    markPresenterCommand(commandId);
    sendPresenterChannel(msg);
    try{ window.opener?.postMessage(Object.assign({ssgPresenter:true},msg),'*'); }catch(err){}
    return msg;
  }
  function sendToPresenterMode(mode,type,payload){
    if(APP_CONFIG.mode==='display'&&new URLSearchParams(location.search).get('viewOnly')==='1')return;
    const commandId=presenterCommandId();
    const msg=Object.assign({type:type,commandId:commandId},payload||{});
    markPresenterCommand(commandId);
    // BroadcastChannel handles the already-open presenter windows without
    // ever activating/focusing either window.
    sendPresenterChannel(msg);
    // The main app relays timer/active-item messages to the display window.
    try{ window.opener?.postMessage(Object.assign({ssgPresenter:true},msg),'*'); }catch(err){}
    return msg;
  }
  function focusPresenterWindow(mode){
    try{
      const stored = mode==='display' ? state.displayWindow : state.controlWindow;
      if(stored && !stored.closed){ stored.focus(); return true; }
    }catch(err){}
    try{
      const name = mode==='display' ? 'SSG_PROGRAM_DISPLAY' : 'SSG_PROGRAM_CONTROL';
      const w = window.open('', name);
      if(w){ w.focus(); return true; }
    }catch(err){}
    return false;
  }
  function requestPresenterTargetToggle(currentTarget, sourceMode){
    const next=currentTarget==='control'?'display':'control';
    const id=presenterCommandId();
    const msg={ssgPresenter:true,type:'toggleTarget',target:next,sourceMode:sourceMode,commandId:id};
    markPresenterCommand(id);
    try{ window.opener?.postMessage(msg,'*'); }catch(err){}
    // Keep both windows visually in sync even before the parent replies.
    sendPresenterChannel({type:'targetState',target:next,commandId:presenterCommandId()});
    return next;
  }

  function tryRestoreSession(){

          storeAuth({token:user.uid,role:session.role,email:user.email||'',username:user.displayName||user.email,name:user.displayName||user.email,task:''});
          startAuthenticatedApp();
        }
      } catch(err) {

  function updateSsgDashboardClock(){
    const timeEl=document.getElementById('ssgDashboardClockTime');
    const dateEl=document.getElementById('ssgDashboardClockDate');
    if(!timeEl||!dateEl)return;
    const now=new Date();
    const timeOptions={timeZone:'Asia/Manila',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h12'};
    const time=now.toLocaleTimeString('en-US',timeOptions).replace(/\s?(AM|PM)$/,' $1');
    timeEl.textContent=`${time} PHT (UTC+8)`;
    const dateOptions={timeZone:'Asia/Manila'};
    const day=now.toLocaleDateString('en-US',{...dateOptions,weekday:'long'});
    const date=now.toLocaleDateString('en-GB',{...dateOptions,day:'2-digit',month:'long',year:'numeric'});
    dateEl.textContent=`${date}, ${day}`;
  }

  // Mobile browsers commonly turn window.open() into a new tab instead of a popup.
  // On phones/tablets, keep the prompter in the current tab; desktop keeps popup windows.
  function isPhoneOrTablet(){
    const ua=String(navigator.userAgent||'');
    const appleTablet=navigator.platform==='MacIntel'&&Number(navigator.maxTouchPoints||0)>1;
    const touch=Number(navigator.maxTouchPoints||0)>1;
    const coarse=!!(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches);
    return /Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(ua)||appleTablet||(touch&&coarse);
  }
  function openPrompterDestination(url,name,features){
    if(isPhoneOrTablet()){
      window.location.assign(url);
      return {sameTab:true,window:null};
    }
    return {sameTab:false,window:window.open(url,name,features)};
  }

  function sequenceFormatBracketText(text, scriptMode, inlineState){
    const raw=String(text||'');
    let html='', chunk='', hostMode=false, boldMode=!!(inlineState&&inlineState.boldMode);
    const flush=()=>{
      if(!chunk)return;
      const safe=esc(chunk);
      if(hostMode) html+='<span class="sequence-host-instruction">'+safe+'</span>';
      else if(scriptMode) html+='<span class="'+(boldMode?'sequence-script-bold':'sequence-script-plain')+'">'+safe+'</span>';
      else html+=safe;
      chunk='';
    };
    for(let i=0;i<raw.length;){
      if(scriptMode && raw.slice(i,i+2)==='//'){
        flush(); boldMode=!boldMode; i+=2; continue;
      }
      if(raw[i]==='['){
        flush(); hostMode=true; i++; continue;
      }
      if(raw[i]===']'){
        flush(); hostMode=false; i++; continue;
      }
      chunk+=raw[i++];
    }
    flush();
    if(inlineState) inlineState.boldMode=boldMode;
    return html;
  }
  function sequenceFormatTechText(text){
    const raw=String(text||'');
    return esc(raw).replace(/\*\*\*([^\n]*?)\*\*\*/g,'<span class="sequence-tech-instruction">$1</span>');
  }
  function sequenceFormatHostLine(text, scriptMode, inlineState, hostGuide){
    const raw=String(text||'');
    const m=raw.match(/^\s*(.+?)\s*:\s*(.*)$/);
    if(!m)return null;
    const map=sequenceHostMap(hostGuide);
    const key=m[1].trim().toUpperCase();
    if(!map[key])return null;
    return '<span class="sequence-host-name" style="color:'+escAttr(map[key])+'">'+esc(m[1].trim())+':</span> <span class="sequence-script-line">'+sequenceFormatBracketText(m[2],!!scriptMode,inlineState)+'</span>';
  }
  function formatSequenceDetailsHtml(text, editorMode, hostGuide){
    const raw=String(text||'').replace(/\r/g,'');
    if(!raw.trim()) return editorMode ? '<div class="sequence-format-line">- NAME / SONG TITLE / NOTES INPUT HERE</div>' : '';
    const lines=raw.split('\n'); let html='';
    lines.forEach(line=>{
      const trimmed=line.trim();
      if(!trimmed){html+='<div class="sequence-format-line">&nbsp;</div>';return;}
      const hostLine=sequenceFormatHostLine(trimmed,false,null,hostGuide);
      if(hostLine){html+='<div class="sequence-format-line">'+hostLine+'</div>';return;}
      const m=trimmed.match(/^(ONCAM(?:\s*#?\s*\d+)?)\s*:\s*(.*)$/i);
      if(m){html+='<div class="sequence-format-oncam sequence-format-line"><span class="sequence-format-oncam-label">'+esc(m[1].toUpperCase())+':</span><span class="sequence-format-oncam-name">'+sequenceFormatBracketText(m[2]||'')+'</span></div>';return;}
      html+='<div class="sequence-format-line">'+sequenceFormatBracketText(line)+'</div>';
    });
    return html;
  }
  function formatSequenceScriptHtml(text, editorMode, hostGuide){
    const raw=String(text||'').replace(/\r/g,''); if(!raw.trim())return '';
    const lines=raw.split('\n'); let html=''; let techMode=false; const inlineState={boldMode:false};
    lines.forEach(line=>{
      const trimmed=line.trim();
      if(!trimmed){html+='<div class="sequence-format-line">&nbsp;</div>';return;}
      if(trimmed==='SCRIPT')return;
      if(trimmed==='***'){techMode=!techMode;return;}
      const hostLine=sequenceFormatHostLine(trimmed,true,inlineState,hostGuide);
      if(hostLine){html+='<div class="sequence-format-line">'+hostLine+'</div>';return;}
      const tech=trimmed.match(/^TECH\s*:\s*(.*)$/i);
      if(tech){html+='<div class="sequence-format-line"><span class="sequence-tech-instruction">TECH: '+sequenceFormatBracketText(tech[1],true,inlineState)+'</span></div>';return;}
      if(/\*\*\*[^\n]*?\*\*\*/.test(line)){html+='<div class="sequence-format-line">'+sequenceFormatTechText(line)+'</div>';return;}
      if(techMode){html+='<div class="sequence-format-line"><span class="sequence-tech-instruction">'+sequenceFormatBracketText(line,true,inlineState)+'</span></div>';return;}
      html+='<div class="sequence-format-line">'+sequenceFormatBracketText(line,true,inlineState)+'</div>';
    });
    return html;
  }

  function autoFillVideoTrt(itemCard,fileId,mediaUrl,mimeType,knownDuration){
    if(!itemCard)return;
    const trtInput=itemCard.querySelector('.item-trt-input');
    if(!trtInput)return;
    const isMedia=/(audio|video|mp3|mp4|m4a|wav|mpeg|ogg|webm|quicktime)/i.test(String(mimeType||'')+' '+String(mediaUrl||'')+' '+String(itemCard.querySelector('.item-song-search')?.value||''));
    if(!isMedia)return;
    const requestId=(Number(itemCard.dataset.trtRequestId)||0)+1;
    itemCard.dataset.trtRequestId=String(requestId);
    const applyDuration=(seconds)=>{
      if(!Number.isFinite(seconds)||seconds<=0||itemCard.dataset.trtRequestId!==String(requestId))return false;
      trtInput.value=formatTrtSeconds(Math.round(seconds));
      trtInput.dispatchEvent(new Event('input',{bubbles:true}));
      recalculateEditorTimes();
      showToast('TRT updated automatically from the selected media.');
      return true;
    };
    const cached=Number(knownDuration);
    if(Number.isFinite(cached)&&cached>0&&applyDuration(cached))return;
    const url=String(mediaUrl||itemCard.dataset.mediaUrl||'').trim();
    if(!url){showToast('Could not read media duration. Check that the selected MP3/MP4 has a playable link.');return;}
    const candidates=[];
    try{
      const parsed=new URL(url,location.href);
      const driveMatch=parsed.pathname.match(/\/file\/d\/([^/]+)/)||parsed.pathname.match(/\/d\/([^/]+)/);
      const id=parsed.searchParams.get('id')||(driveMatch&&driveMatch[1]);
      if(id&&/drive\\.google\\.com$/i.test(parsed.hostname)){
        candidates.push('https://drive.google.com/uc?export=download&id='+encodeURIComponent(id));
        candidates.push('https://drive.google.com/uc?id='+encodeURIComponent(id)+'&export=download');
      }
      candidates.push(url);
    }catch(_){candidates.push(url);}
    const tryCandidate=(index)=>{
      if(itemCard.dataset.trtRequestId!==String(requestId))return;
      if(index>=candidates.length){
        console.warn('Unable to read selected media duration. The URL may require Google Drive sign-in or may not be directly playable.');
        showToast('Could not read TRT from this media link. If it is a restricted Drive file, enter TRT manually.');
        return;
      }
      const candidate=candidates[index];
      const ext=(candidate.split('?')[0].split('.').pop()||'').toLowerCase();
      const video=/mp4|m4v|mov|webm|ogv/.test(ext)||/video/i.test(String(mimeType||''));
      const media=document.createElement(video?'video':'audio');
      let settled=false;
      const cleanup=()=>{media.removeAttribute('src');try{media.load();}catch(_){}};
      const fail=()=>{if(settled)return;settled=true;cleanup();tryCandidate(index+1);};
      media.preload='metadata';
      media.muted=true;
      media.onloadedmetadata=()=>{
        if(settled)return;settled=true;
        const seconds=Number(media.duration);
        cleanup();
        if(!applyDuration(seconds))tryCandidate(index+1);
      };
      media.onerror=fail;
      const timeout=setTimeout(()=>{if(!settled){settled=true;cleanup();tryCandidate(index+1);}},9000);
      const oldLoaded=media.onloadedmetadata;
      media.onloadedmetadata=()=>{clearTimeout(timeout);oldLoaded();};
      media.src=candidate;
      try{media.load();}catch(_){clearTimeout(timeout);fail();}
    };
    tryCandidate(0);
  }

  function setupSongPicker(itemCard){
    const input=itemCard.querySelector('.item-song-search'),results=itemCard.querySelector('.song-picker-results');
    if(!input||!results)return;
    let timer=null;
    let seq=0;

    function runSearch(q,requestSeq){
      const token=state.auth?.token||getStoredAuth()?.token||'';
      google.script.run.withSuccessHandler(function(rows){
        if(requestSeq!==seq)return;
        rows=rows||[];
        if(!rows.length){
          results.innerHTML='<div class="media-result"><div class="media-result-meta">No matching MCGI songs/media/files found.</div></div>';
          return;
        }
        results.innerHTML=rows.map(function(r){
          return '<div class="media-result" data-title="'+escAttr(r.title)+'" data-link="'+escAttr(r.link||'')+'" data-file-id="'+escAttr((String(r.link||'').match(/[-\w]{20,}/)||[''])[0])+'">'
            +'<div class="media-result-name">'+esc(r.title)+'</div>'
            +'<div class="media-result-meta">'+esc(r.mediaType||'FILE')+' · '+esc(r.source||'MCGI Song Database')+(r.sheet?' · '+esc(r.sheet):'')+'</div>'
            +'</div>';
        }).join('');

        results.querySelectorAll('.media-result[data-title]').forEach(function(row){
          row.addEventListener('click',function(){
            const title=this.dataset.title||'';
            const link=this.dataset.link||'';
            const linkInput=itemCard.querySelector('.item-link');

            // Selected database result goes ONLY into the search field + Link.
            // Item Title is a separate manual field and is never overwritten.
            input.value=title;
            itemCard.dataset.mediaUrl=link;
            if(linkInput){
              linkInput.value=link;
              linkInput.dispatchEvent(new Event('input',{bubbles:true}));
            }

            results.classList.remove('show');
            results.innerHTML='';
            autoFillVideoTrt(itemCard,this.dataset.fileId||'');
            syncGuide();
            renderLivePreview();
            scheduleGuideAutoSave();
          });
        });
      }).withFailureHandler(function(err){
        if(requestSeq!==seq)return;
        results.innerHTML='<div class="media-result"><div class="media-result-meta">Unable to search MCGI Song / Media Library: '+esc(err?.message||err)+'</div></div>';
      }).apiCall('searchMcgiSongs',[q],token);
    }

    input.addEventListener('input',function(){
      const q=this.value.trim();
      if(timer)clearTimeout(timer);
      seq++;
      const requestSeq=seq;
      if(q.length<1){
        results.classList.remove('show');
        results.innerHTML='';
        return;
      }
      results.innerHTML='<div class="media-result"><div class="media-result-meta">Searching local MCGI Song / Media Database...</div></div>';
      results.classList.add('show');
      // Short debounce only; the actual search is a local indexed-sheet lookup.
      timer=setTimeout(()=>runSearch(q,requestSeq),90);
    });

    input.addEventListener('focus',function(){
      if(this.value.trim().length>=1 && results.innerHTML)results.classList.add('show');
    });
    input.addEventListener('keydown',function(e){
      if(e.key==='Escape'){
        results.classList.remove('show');
        results.innerHTML='';
      }
    });
  }

  function setupMediaPicker(itemCard){
    const input=itemCard.querySelector('.item-media');
    const results=itemCard.querySelector('.media-picker-results');
    const selected=itemCard.querySelector('.media-selected');
    const clearBtn=itemCard.querySelector('.media-clear');
    if(!input||!results)return;

    input.addEventListener('input',function(){
      const q=this.value.trim();
      if(mediaSearchTimers[itemCard.dataset.itemId]) clearTimeout(mediaSearchTimers[itemCard.dataset.itemId]);
      if(q.length<2){ results.classList.remove('show'); results.innerHTML=''; return; }
      results.innerHTML='<div class="media-result"><div class="media-result-meta">Searching Parent MCGI Music Department Drive...</div></div>';
      results.classList.add('show');
      mediaSearchTimers[itemCard.dataset.itemId]=setTimeout(function(){
        const token=state.auth?.token || getStoredAuth()?.token || '';
        google.script.run.withSuccessHandler(function(files){
          files=files||[];
          if(!files.length){
            results.innerHTML='<div class="media-result"><div class="media-result-meta">No matching files found.</div></div>';
            return;
          }
          results.innerHTML=files.map(function(file){
            return '<div class="media-result" data-file-id="'+escAttr(file.id)+'" data-file-name="'+escAttr(file.name)+'" data-file-url="'+escAttr(file.url)+'"><div class="media-result-name">'+esc(file.name)+'</div><div class="media-result-meta">'+esc(file.folder||'MCGI Music Department')+' · '+esc(file.mimeType||'File')+'</div></div>';
          }).join('');
          results.querySelectorAll('.media-result[data-file-id]').forEach(function(row){
            row.addEventListener('click',function(){
              input.value=this.dataset.fileName||'';
              itemCard.dataset.mediaUrl=this.dataset.fileUrl||'';
              results.classList.remove('show');
              if(selected){
                selected.style.display='flex';
                const strong=selected.querySelector('strong');
                if(strong)strong.textContent=input.value;
              }
              autoFillVideoTrt(itemCard,row.dataset.fileId||'',row.dataset.fileUrl||'',row.dataset.mimeType||'',row.dataset.durationSeconds||'');
              renderLivePreview();
              scheduleGuideAutoSave();
            });
          });
        }).withFailureHandler(function(err){
          results.innerHTML='<div class="media-result"><div class="media-result-meta">Unable to search the Parent MCGI Music Department Drive: '+esc(err?.message||err)+'</div></div>';
        }).apiCall('searchMcgiMedia',[q],token);
      },300);
    });

    input.addEventListener('focus',function(){
      if(this.value.trim().length>=2 && results.innerHTML) results.classList.add('show');
    });
    if(clearBtn){
      clearBtn.addEventListener('click',function(){
        input.value='';
        itemCard.dataset.mediaUrl='';
        if(selected)selected.style.display='none';
        results.classList.remove('show');
        results.innerHTML='';
        renderLivePreview();
        scheduleGuideAutoSave();
      });
    }
  }

  let guideAutoSaveTimer=null;
  let guideDraftPublishTimer=null;
  let guideDraftPublishBusy=false;
  let guideDraftPublishQueued=false;
  function scheduleGuideDraftPublish(){
    if(!state.guide?.id||!state.auth?.token&&!getStoredAuth()?.token)return;
    clearTimeout(guideDraftPublishTimer);
    guideDraftPublishTimer=setTimeout(publishGuideDraftNow,120);
  }
  function publishGuideDraftNow(){
    if(!state.guide?.id)return;
    syncGuide();
    const snapshot=clone(state.guide);
    if(!snapshot?.id)return;
    if(guideDraftPublishBusy){guideDraftPublishQueued=true;return;}
    guideDraftPublishBusy=true;
    guideDraftPublishQueued=false;
    const token=state.auth?.token||getStoredAuth()?.token||'';
    google.script.run.withSuccessHandler(()=>{
      guideDraftPublishBusy=false;
      if(guideDraftPublishQueued){guideDraftPublishQueued=false;publishGuideDraftNow();}
    }).withFailureHandler(err=>{
      guideDraftPublishBusy=false;
      console.warn('Live editor draft publish failed:',err);
      if(guideDraftPublishQueued){guideDraftPublishQueued=false;publishGuideDraftNow();}
    }).apiCall('publishGuideDraft',[snapshot],token);
  }
  let guideAutoSaveBusy=false;
  let guideAutoSaveQueued=false;
  let guideAutoSaveSnapshotHash='';
  function updateGuideSaveStatus(message,kind){
    const el=$('guideSaveStatus');
    if(!el)return;
    el.textContent=message||'';
    el.className='save-status '+(kind||'');
  }
  function scheduleGuideAutoSave(){
    if(!state.guide?.id)return;
    scheduleGuideDraftPublish();
    clearTimeout(guideAutoSaveTimer);
    updateGuideSaveStatus('Saving…','saving');
    guideAutoSaveTimer=setTimeout(runGuideAutoSave,500);
  }
  function runGuideAutoSave(){
    if(!state.guide?.id)return;
    syncGuide();
    if(!String(state.guide.title||'').trim())return;
    const snapshot=clone(state.guide);
    let hash='';
    try{hash=JSON.stringify(snapshot);}catch(err){hash='';}
    if(hash && hash===guideAutoSaveSnapshotHash){
      updateGuideSaveStatus(`Saved ${state.guide.updatedAt||''}`.trim(),'saved');
      return;
    }
    if(guideAutoSaveBusy){guideAutoSaveQueued=true;return;}
    guideAutoSaveBusy=true;
    guideAutoSaveQueued=false;
    updateGuideSaveStatus('Saving…','saving');
    const token=state.auth?.token||getStoredAuth()?.token||'';
    google.script.run.withSuccessHandler(result=>{
      guideAutoSaveBusy=false;
      if(result?.guide){
        state.guide=result.guide;
        guideAutoSaveSnapshotHash=hash;
        updateGuideSaveStatus(`✓ Saved ${result.guide.updatedAt||''}`.trim(),'saved');
        const idx=state.guides.findIndex(g=>String(g.id)===String(result.guide.id));
        const summary={id:result.guide.id,title:result.guide.title,eventDate:result.guide.eventDate,venue:result.guide.venue,organizersCallTime:result.guide.organizersCallTime,formalStart:result.guide.formalStart,mainBgm:result.guide.mainBgm,fileLink:result.guide.fileLink,createdAt:result.guide.createdAt,updatedAt:result.guide.updatedAt,type:result.guide.type,ownerUsername:result.guide.ownerUsername,ownerName:result.guide.ownerName,visibility:result.guide.visibility,publicAccess:result.guide.publicAccess,isOwner:true,canEdit:true};
        if(idx>=0)state.guides[idx]=summary;else state.guides.unshift(summary);
        showToast('Guide saved successfully. You can check it in Saved Guides.');
      }
      const queued=guideAutoSaveQueued;guideAutoSaveQueued=false;
      if(queued)runGuideAutoSave();
    }).withFailureHandler(err=>{
      guideAutoSaveBusy=false;guideAutoSaveQueued=false;
      updateGuideSaveStatus('Save failed','error');
      handleError(err);
    }).apiCall('saveGuide',[snapshot],token);
  }

function broadcastGuideToPresenter(){
    if(!state.guide)return;
    const guide=clone(state.guide);
    const commandId=presenterCommandId();
    // Same-origin windows receive updates even if opener references are unavailable.
    sendPresenterChannel({type:'guide',guide,commandId});
    [state.displayWindow,state.controlWindow].forEach(win=>{try{if(win&&!win.closed)win.postMessage({ssgPresenter:true,type:'guide',guide:clone(guide),commandId},'*');}catch(err){}});
  }

  function setupLivePreviewListener(){
    if(APP_CONFIG.mode==='main')openPresenterChannel();
    // Bind once at document level so replacing #page-editor with a template or
    // re-rendering a saved guide can never orphan the preview/autosave listener.
    if(document.documentElement.dataset.guideEditorEventsBound==='1')return;
    document.documentElement.dataset.guideEditorEventsBound='1';
    const handle=function(e){
      const target=e.target;
      if(!target || !target.closest || !target.closest('#page-editor'))return;
      if(!state.guide)return;
      try{
        if(String(state.guide.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
          syncSequenceGuide();
          renderSequencePreview();
          scheduleGuideAutoSave(); broadcastGuideToPresenter();
        }else{
          syncGuide();
          renderLivePreview();
          scheduleGuideAutoSave(); broadcastGuideToPresenter();
        }
      }catch(err){console.error(err);}
    };
    document.addEventListener('input',handle,true);
    document.addEventListener('change',handle,true);
  }

  // Reorder program items and sequence takes by dragging their grip. Arrow controls remain available on touch devices.
  let ssgDraggedCard=null;
  document.addEventListener('dragstart',function(e){
    const handle=e.target.closest('.item-drag-handle,.sequence-drag-handle');
    if(!handle)return;
    const card=handle.closest('.item-card,.sequence-item');
    if(!card)return;
    ssgDraggedCard=card;
    card.classList.add('ssg-dragging');
    if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',card.dataset.itemId||'');}catch(_){}}
  });
  document.addEventListener('dragover',function(e){
    if(!ssgDraggedCard)return;
    const target=e.target.closest('.item-card,.sequence-item');
    if(!target||target===ssgDraggedCard||target.parentElement!==ssgDraggedCard.parentElement)return;
    e.preventDefault();
    if(e.dataTransfer)e.dataTransfer.dropEffect='move';
    target.classList.add('ssg-drop-target');
  });
  document.addEventListener('dragleave',function(e){const target=e.target.closest('.item-card,.sequence-item');if(target)target.classList.remove('ssg-drop-target');});
  document.addEventListener('drop',function(e){
    if(!ssgDraggedCard)return;
    const target=e.target.closest('.item-card,.sequence-item');
    if(!target||target===ssgDraggedCard||target.parentElement!==ssgDraggedCard.parentElement)return;
    e.preventDefault();
    const rect=target.getBoundingClientRect();
    const after=(e.clientY-rect.top)>rect.height/2;
    target.parentElement.insertBefore(ssgDraggedCard,after?target.nextSibling:target);
    const isSequence=ssgDraggedCard.classList.contains('sequence-item');
    ssgDraggedCard.classList.remove('ssg-dragging');
    document.querySelectorAll('.ssg-drop-target').forEach(el=>el.classList.remove('ssg-drop-target'));
    ssgDraggedCard=null;
    if(isSequence){syncSequenceGuide();renderSequenceItems();renderSequencePreview();scheduleGuideAutoSave();broadcastGuideToPresenter();}
    else{syncGuide();renderSections();renderLivePreview();scheduleGuideAutoSave();broadcastGuideToPresenter();}
  });
  document.addEventListener('dragend',function(){if(ssgDraggedCard)ssgDraggedCard.classList.remove('ssg-dragging');ssgDraggedCard=null;document.querySelectorAll('.ssg-drop-target').forEach(el=>el.classList.remove('ssg-drop-target'));});

  document.addEventListener('click',function(e){
    if(e.target.closest('.media-picker,.song-picker')) return;
    document.querySelectorAll('.media-picker-results.show,.song-picker-results.show').forEach(function(el){el.classList.remove('show');});
  });

  function loadTemplateIntoEditor(){ safeRun('getCPFCTemplate',[],template=>{state.guide=clone(template||newBlankGuide());state.guide.id='';state.guide.type='PROGRAM_FLOW';renderEditor();showToast('CP/FC template loaded. You can edit it directly, then save it as your guide.');}); }
  function addSection(){ syncGuide(); state.guide.sections.push(emptySection(state.guide.sections.length+1)); renderSections(); renderLivePreview(); scheduleGuideAutoSave(); }
  function removeSection(id){ syncGuide(); state.guide.sections=state.guide.sections.filter(s=>s.id!==id); if(!state.guide.sections.length)state.guide.sections=[emptySection(1)]; renderSections(); renderLivePreview(); scheduleGuideAutoSave(); }
  function addItem(sectionId){ syncGuide(); const s=state.guide.sections.find(x=>x.id===sectionId); if(!s)return; s.items.push(emptyItem(s.items.length+1)); renderSections(); renderLivePreview(); scheduleGuideAutoSave(); }
  function moveProgramItem(itemId,delta){ syncGuide(); for(const sec of (state.guide.sections||[])){ const from=sec.items.findIndex(i=>String(i.id)===String(itemId)); if(from<0)continue; const to=from+Number(delta||0); if(to<0||to>=sec.items.length)return; const [item]=sec.items.splice(from,1); sec.items.splice(to,0,item); renderSections(); renderLivePreview(); scheduleGuideAutoSave(); broadcastGuideToPresenter(); return; } }
  function moveSequenceItem(itemId,delta){ syncSequenceGuide(); const items=state.guide.sections?.[0]?.items||[]; const from=items.findIndex(i=>String(i.id)===String(itemId)); const to=from+Number(delta||0); if(from<0||to<0||to>=items.length)return; const [item]=items.splice(from,1); items.splice(to,0,item); renderSequenceItems(); renderSequencePreview(); scheduleGuideAutoSave(); broadcastGuideToPresenter(); }
  function removeItem(itemId){ syncGuide(); state.guide.sections.forEach(s=>s.items=s.items.filter(i=>i.id!==itemId)); state.guide.sections.forEach(s=>s.items.forEach((i,idx)=>{if(!i.number)i.number=String(idx+1)})); renderSections(); renderLivePreview(); scheduleGuideAutoSave(); }

  function saveGuideClient(){
    if(!state.guide)return;
    if(String(state.guide.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE') syncSequenceGuide();
    else syncGuide();
    if(!String(state.guide.title||'').trim()){showToast('Guide/Event Title is required.');return;}

    // Existing guides are updates. Do not reopen the Private/Public chooser and
    // accidentally change their ownership/visibility. The saved record's current
    // visibility is preserved and the guide is updated in place.
    if(String(state.guide.id||'').trim()){
      persistGuideNow('Updating guide...', '✓ Guide updated successfully.');
      return;
    }
    persistGuideNow('Saving guide...', '✓ Guide saved successfully.');
  }

  function persistGuideNow(startMessage, successMessage){
    showToast(startMessage||'Saving guide...');
    updateGuideSaveStatus('Saving…','saving');
    clearTimeout(guideAutoSaveTimer);
    const snapshot=clone(state.guide);
    const token=state.auth?.token || getStoredAuth()?.token || '';
    if(!token){ handleAuthFailure('Please sign in first.'); return; }

    let retried=false;
    function send(){
      google.script.run
        .withSuccessHandler(result=>{
          if(!result?.guide){
            updateGuideSaveStatus('Save failed','error');
            showToast('Guide save failed.');
            return;
          }
          state.guide=result.guide;
          guideAutoSaveSnapshotHash=JSON.stringify(clone(state.guide));
          updateGuideSaveStatus(`✓ Saved ${state.guide.updatedAt||''}`.trim(),'saved');
          const savedSummary={id:state.guide.id,title:state.guide.title,eventDate:state.guide.eventDate,venue:state.guide.venue,organizersCallTime:state.guide.organizersCallTime,formalStart:state.guide.formalStart,mainBgm:state.guide.mainBgm,fileLink:state.guide.fileLink,createdAt:state.guide.createdAt,updatedAt:state.guide.updatedAt,type:state.guide.type,ownerUsername:state.guide.ownerUsername,ownerName:state.guide.ownerName,visibility:state.guide.visibility,publicAccess:state.guide.publicAccess,isOwner:true,canEdit:true};
          const idx=state.guides.findIndex(g=>String(g.id)===String(savedSummary.id));
          if(idx>=0)state.guides[idx]=savedSummary; else state.guides.unshift(savedSummary);
          showToast(successMessage||'✓ Guide saved successfully.');
          broadcastGuideToPresenter();
        })
        .withFailureHandler(err=>{
          const message=(err&&err.message)?err.message:String(err);
          // A transient Apps Script/cache authorization miss must not immediately
          // sign the user out. Retry the same save once with the still-valid token.
          if(!retried && /^AUTH_REQUIRED:/.test(message)){
            retried=true;
            setTimeout(send,250);
            return;
          }
          updateGuideSaveStatus('Save failed','error');
          handleError(err);
        })
        .apiCall('saveGuide',[snapshot],token);
    }
    send();
  }

  function previewHTML(g){
    if(String(g.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      const items=sequenceItems(g);

  function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('Copied.');}
  function buildText(g){
    let lines=[g.title||'TECH GUIDE','']; if(g.eventDate)lines.push('Event Date: '+g.eventDate); if(g.organizersCallTime)lines.push('Organizers’ Call Time: '+g.organizersCallTime); if(g.formalStart)lines.push('Formal Start: '+g.formalStart); if(g.mainBgm)lines.push('Main BGM: '+g.mainBgm); if(g.fileLink)lines.push('General File Link: '+g.fileLink); lines.push('');
    if(String(g.type||'PROGRAM_FLOW').toUpperCase()==='PROGRAM_SEQUENCE'){
      sequenceItems(g).forEach((it,ii)=>{lines.push('[TAKE '+(it.number||String(ii))+']');if(it.startTime)lines.push(it.startTime);if(it.title)lines.push('** '+it.title);if(it.participants)lines.push('ONCAM / DETAILS: '+it.participants);if(it.media)lines.push('- '+it.media);if(it.mediaUrl)lines.push('DRIVE LINK: '+it.mediaUrl);if(it.link)lines.push('EXTERNAL LINK: '+it.link);if(it.notes)lines.push('NOTE: '+it.notes);lines.push('');});
    }else{
      (g.sections||[]).forEach((s,si)=>{lines.push((si+1)+'. '+s.title);if(s.startTime||s.endTime)lines.push('TIME: '+(s.startTime||'—')+' – '+(s.endTime||'—'));if(s.notes)lines.push('NOTE: '+s.notes);lines.push('');(s.items||[]).forEach((it,ii)=>{lines.push('#'+(it.number||String(ii+1))+' '+it.title);lines.push('TIME: '+(it.startTime||'—')+' – '+(it.endTime||'—'));const d=trtDisplay(it);if(d)lines.push('TRT: '+d);if(it.media)lines.push('MEDIA / FILE: '+it.media);if(it.mediaUrl)lines.push('DRIVE LINK: '+it.mediaUrl);if(it.link)lines.push('EXTERNAL LINK: '+it.link);if(it.participants)lines.push('PARTICIPANTS / DETAILS: '+it.participants);if(it.notes)lines.push('NOTES: '+it.notes);lines.push('');});});
    }
    return lines.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  }

  function buildGoogleDocsTwoColumnMarkup(guide,fontSize){
    const parsed=document.createElement('div');parsed.innerHTML=previewHTML(guide);
    let header=null,blocks=[];

      header=sequence.querySelector('.sequence-preview-header');

      header=parsed.querySelector('.preview-head');
      blocks=Array.from(parsed.children).filter(el=>el!==header);
    }
    const weight=el=>String(el.textContent||'').length;
    const total=blocks.reduce((n,el)=>n+weight(el),0);let left=[],right=[],sum=0;

  }

  function sanitizeRichHtml(html){
    const source=String(html||'');
    const box=document.createElement('div'); box.innerHTML=source;
    const walk=node=>{
      Array.from(node.childNodes).forEach(child=>{
        if(child.nodeType===3)return;
        if(child.nodeType!==1){child.remove();return;}
        const tag=child.tagName.toLowerCase();
        if(['b','strong','i','em','br'].includes(tag)){walk(child);return;}
        if(tag==='div'||tag==='p'){walk(child);const br=document.createElement('br');child.parentNode.insertBefore(br,child.nextSibling);return;}
        const frag=document.createDocumentFragment();while(child.firstChild)frag.appendChild(child.firstChild);child.replaceWith(frag);
        walk(node);
      });
    };
    walk(box);
    return box.innerHTML.replace(/(?:<br>\s*){3,}/gi,'<br><br>');
  }
  function richHtmlToPlainText(html){
    const box=document.createElement('div');box.innerHTML=sanitizeRichHtml(html);
    box.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));
    return (box.textContent||'').replace(/\u00a0/g,' ').replace(/\n{3,}/g,'\n\n');
  }
  function textToRichHtml(text){return esc(String(text||'')).replace(/\r?\n/g,'<br>');}
  function formatLyricSelection(index,command){

  // Lyric Prompter keyboard policy:

  function setupLyricKeyboard(){
    if(window._lyricKeyboardBound)return;
    window._lyricKeyboardBound=true;
    window.addEventListener('keydown',function(e){
      // Deliberately keep the main window free of prompter controls.
      // The only main-window shortcut is: ` ` ` = Send to Prompter.
      if(APP_CONFIG.mode!=='main')return;
      if(state.page!=='lyrics'||lyricMode!=='text')return;
      if(e.code!=='Backquote' && e.key!=='`')return;

  function applyLyricDisplayPayload(p){
    const screen=$('lyricDisplayScreen'),text=$('lyricDisplayText'),scroll=$('lyricDisplayScroll');

    const incomingThemeVersion=Number.isFinite(Number(p.themeVersion))?Number(p.themeVersion):null;

    text.style.maxWidth=displayLyricState.lineWidth+'%';

  }

  function stopDisplayLyricScroll(){
    if(displayLyricState.raf)cancelAnimationFrame(displayLyricState.raf);
    displayLyricState.raf=null;
    displayLyricState.scrolling=false;
    displayLyricState.lastScrollTime=0;
    const el=$('lyricDisplayScroll');
    if(el)displayLyricState.scrollPosition=el.scrollTop;
  }
  function startDisplayLyricScroll(){
    if(displayLyricState.scrolling)return;
    const el=$('lyricDisplayScroll');
    if(!el)return;
    displayLyricState.scrolling=true;
    displayLyricState.scrollPosition=el.scrollTop;
    displayLyricState.lastScrollTime=performance.now();
    const speedTable=[65,80,100,120,150];
    const loop=(now)=>{
      if(!displayLyricState.scrolling)return;
      const area=$('lyricDisplayScroll');
      if(!area){stopDisplayLyricScroll();return;}
      // Clamp long frame gaps (e.g. browser scheduling hiccups) so one delayed
      // animation frame cannot create a visible sudden jump in lyric scrolling.
      const rawDt=Math.max(0,now-displayLyricState.lastScrollTime||0);
      const dt=Math.min(rawDt,50);
      displayLyricState.lastScrollTime=now;
      const speed=speedTable[Math.max(1,Math.min(5,Number(displayLyricState.speed)||3))-1];
      const max=Math.max(0,area.scrollHeight-area.clientHeight);
      displayLyricState.scrollPosition=Math.min(max,displayLyricState.scrollPosition+(speed*dt/1000));
      area.scrollTop=Math.round(displayLyricState.scrollPosition);
      if(displayLyricState.scrollPosition>=max){
        displayLyricState.scrollPosition=max;
        area.scrollTop=max;
        stopDisplayLyricScroll();
        return;
      }
      displayLyricState.raf=requestAnimationFrame(loop);
    };
    displayLyricState.raf=requestAnimationFrame(loop);
  }

  function initLyricDisplay(){
    openLyricChannel();
    document.body.innerHTML=`<div class="lyric-display-shell"><div id="lyricDisplayScreen" class="lyric-display-screen black-theme"><div id="lyricDisplayScroll" class="lyric-display-scroll"><div id="lyricDisplayText" class="lyric-display-text">Waiting for lyrics...</div></div></div></div>`;

    try{
      const raw=localStorage.getItem(LYRIC_STORAGE_KEY);
      if(raw){const saved=JSON.parse(raw);if(saved?.payload)applyLyricDisplayPayload(saved.payload);}
      window.addEventListener('storage',e=>{if(e.key===LYRIC_STORAGE_KEY&&e.newValue){try{const saved=JSON.parse(e.newValue);if(saved?.payload)applyLyricDisplayPayload(saved.payload);}catch(err){}}});
    }catch(err){}

    window.addEventListener('message',e=>{const d=e.data||{};if(!d||d.ssgLyric!==true)return;if(d.type==='state')applyLyricDisplayPayload(d.payload||{});});

    // IMPORTANT: this listener belongs ONLY to the display window.
    // The window is focused by sendLyricToPrompter(), so the user does not
    // need to click the display before shortcuts become active.
    window.addEventListener('keydown',e=>{
      if(e.repeat)return;
      const code=e.code, sc=$('lyricDisplayScroll'), t=$('lyricDisplayText');

      if(code==='Space'){
        e.preventDefault();e.stopPropagation();
        if(displayLyricState.scrolling){displayLyricState.localScrollControl=true;stopDisplayLyricScroll();}else{displayLyricState.localScrollControl=true;startDisplayLyricScroll();}
        return;
      }
      if(/^Digit[1-5]$/.test(code)){
        e.preventDefault();e.stopPropagation();
        displayLyricState.speed=Number(code.slice(-1));
        displayLyricState.localScrollControl=true;
        if(displayLyricState.scrolling){ const pos=$('lyricDisplayScroll')?.scrollTop||0; stopDisplayLyricScroll(); const sc2=$('lyricDisplayScroll'); if(sc2)sc2.scrollTop=pos; startDisplayLyricScroll(); }
        return;
      }
      if(code==='Digit0'){
        e.preventDefault();e.stopPropagation();
        displayLyricState.localScrollControl=true;
        stopDisplayLyricScroll();
        return;
      }
      if(code==='KeyP'){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        const current=Number.isFinite(Number(displayLyricState.backgroundIndex))?Number(displayLyricState.backgroundIndex):0;
        const next=(current+1)%BUILTIN_LYRIC_BACKGROUNDS.length;
        displayLyricState.backgroundIndex=next;
        displayLyricState.backgroundDataUrl=lyricBackgroundUrl(next);
        displayLyricState.backgroundName=lyricBackgroundName(next);
        const displayScreen=$('lyricDisplayScreen');
        if(displayScreen){
          displayScreen.className='lyric-display-screen '+(next===1?'blue-theme':next===2?'people-theme':next===3?'royal-theme':'black-theme');
          lyricBackgroundStyleDisplay(displayScreen,displayLyricState.backgroundDataUrl);
        }
        sendLyricDisplayBackground();
        return;
      }
      if(code==='BracketLeft'||code==='BracketRight'){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        const cur=displayLyricState.textSize||42;
        const next=code==='BracketLeft'?Math.max(22,cur-3):Math.min(168,cur+3);
        displayLyricState.textSize=next;
        if(t)t.style.fontSize=next+'px';
        return;
      }
      if(code==='Minus'&&!e.shiftKey){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        const cur=displayLyricState.lineWidth||80;
        const next=Math.max(20,cur-5);
        displayLyricState.lineWidth=next;
        if(t)t.style.maxWidth=next+'%';
        return;
      }
      if(code==='Equal'&&!e.shiftKey){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        const cur=displayLyricState.lineWidth||80;
        const next=Math.min(100,cur+5);
        displayLyricState.lineWidth=next;
        if(t)t.style.maxWidth=next+'%';
        return;
      }
      if(code==='NumpadAdd'||code==='NumpadSubtract'){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        if(sc){const delta=code==='NumpadAdd'?250:-250;const max=Math.max(0,sc.scrollHeight-sc.clientHeight);displayLyricState.scrollPosition=Math.max(0,Math.min(max,sc.scrollTop+delta));sc.scrollTop=displayLyricState.scrollPosition;}
        return;
      }
      if(code==='ArrowUp'||code==='ArrowDown'){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        if(sc){const delta=code==='ArrowDown'?100:-100;const max=Math.max(0,sc.scrollHeight-sc.clientHeight);displayLyricState.scrollPosition=Math.max(0,Math.min(max,sc.scrollTop+delta));sc.scrollTop=displayLyricState.scrollPosition;}
        return;
      }
      if(code==='KeyT'){
        displayLyricState.localScrollControl=true;
        e.preventDefault();e.stopPropagation();
        if(sc){sc.scrollTop=0;displayLyricState.scrollPosition=0;}
        return;
      }
      if(code==='ArrowLeft'||code==='ArrowRight'){

        displayLyricState.localScrollControl=true;        e.preventDefault();e.stopPropagation();
        const now=performance.now();
        const same=displayLyricState.lastArrow.key===code&&(now-displayLyricState.lastArrow.time)<=400;
        displayLyricState.lastArrow={key:code,time:now};
        if(same){
          displayLyricState.lastArrow={key:'',time:0};
          const direction=code==='ArrowLeft'?'prev':'next';
          // Navigation is the only keyboard command that goes back to MAIN.
          // MAIN changes the active block and sends the new lyric state back.
          if(!sendLyricChannel('navigate',{direction:direction})){
            try{window.opener?.postMessage({ssgLyric:true,type:'navigate',direction:direction},'*');}catch(err){}
          }
        }
        return;
      }
    },true);

    window.addEventListener('beforeunload',()=>stopDisplayLyricScroll());
    sendLyricDisplayReady();
    try{window.opener?.postMessage({ssgLyric:true,type:'ready'},'*');}catch(err){}
    // Focus immediately after listeners are installed.
    setTimeout(()=>{try{window.focus();}catch(err){}},0);
  }
